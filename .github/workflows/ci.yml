name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run unit and subprocess tests
        run: python -m pytest cli_anything/openwebui/tests -q

      - name: Validate installed console script
        run: |
          cli-anything-openwebui --help
          CLI_ANYTHING_FORCE_INSTALLED=1 python -m pytest cli_anything/openwebui/tests -q -s

      - name: Build source and wheel distributions
        run: |
          python -m pip install build
          python -m build
